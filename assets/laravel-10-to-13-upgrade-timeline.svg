<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
  <title id="title">Laravel 10 to 13 Upgrade Timeline</title>
  <desc id="desc">Public-safe visual summary of the staged Laravel 10 to 13 production e-commerce platform modernization and verified quality gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06162b"/>
      <stop offset="0.55" stop-color="#08213d"/>
      <stop offset="1" stop-color="#031326"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2948"/>
      <stop offset="1" stop-color="#061a31"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <style>
      .title{font:700 65px Arial,Helvetica,sans-serif;fill:#ffffff;letter-spacing:-1px}
      .subtitle{font:600 24px Arial,Helvetica,sans-serif;fill:#f5b942;letter-spacing:5px}
      .stepno{font:700 38px Arial,Helvetica,sans-serif;fill:#f5b942}
      .heading{font:700 26px Arial,Helvetica,sans-serif;fill:#ffffff}
      .body{font:400 18px Arial,Helvetica,sans-serif;fill:#f2f5f8}
      .small{font:400 16px Arial,Helvetica,sans-serif;fill:#e8edf2}
      .metric{font:700 21px Arial,Helvetica,sans-serif;fill:#ffffff}
      .metric2{font:400 17px Arial,Helvetica,sans-serif;fill:#dfe8f0}
      .gold{stroke:#f5b942;fill:none;stroke-width:3}
      .thin{stroke:#c9962b;fill:none;stroke-width:1.5}
      .bullet{fill:#f5b942}
    </style>
  </defs>

  <rect width="1600" height="1130" fill="url(#bg)"/>
  <circle cx="1450" cy="90" r="280" fill="#0d3152" opacity="0.16"/>
  <circle cx="140" cy="1060" r="250" fill="#0d3152" opacity="0.12"/>

  <text x="800" y="92" text-anchor="middle" class="title">Laravel 10 <tspan fill="#f5b942">→</tspan> 13 Upgrade Timeline</text>
  <line x1="460" y1="133" x2="760" y2="133" stroke="#f5b942" stroke-width="3"/>
  <polygon points="800,121 812,133 800,145 788,133" fill="#f5b942"/>
  <line x1="840" y1="133" x2="1140" y2="133" stroke="#f5b942" stroke-width="3"/>
  <text x="800" y="182" text-anchor="middle" class="subtitle">PRODUCTION E-COMMERCE PLATFORM MODERNIZATION</text>

  <line x1="75" y1="270" x2="1530" y2="270" stroke="#f5b942" stroke-width="4"/>
  <polygon points="1530,257 1553,270 1530,283" fill="#f5b942"/>

  <!-- Timeline step nodes -->
  <g>
    <circle cx="145" cy="270" r="39" fill="#08213d" stroke="#f5b942" stroke-width="4"/><text x="145" y="284" text-anchor="middle" class="stepno">1</text>
    <circle cx="405" cy="270" r="39" fill="#08213d" stroke="#f5b942" stroke-width="4"/><text x="405" y="284" text-anchor="middle" class="stepno">2</text>
    <circle cx="665" cy="270" r="39" fill="#08213d" stroke="#f5b942" stroke-width="4"/><text x="665" y="284" text-anchor="middle" class="stepno">3</text>
    <circle cx="925" cy="270" r="39" fill="#08213d" stroke="#f5b942" stroke-width="4"/><text x="925" y="284" text-anchor="middle" class="stepno">4</text>
    <circle cx="1185" cy="270" r="39" fill="#08213d" stroke="#f5b942" stroke-width="4"/><text x="1185" y="284" text-anchor="middle" class="stepno">5</text>
    <circle cx="1445" cy="270" r="39" fill="#08213d" stroke="#f5b942" stroke-width="4"/><text x="1445" y="284" text-anchor="middle" class="stepno">6</text>
  </g>

  <!-- Cards -->
  <g filter="url(#shadow)">
    <rect x="25" y="330" width="240" height="465" rx="18" fill="url(#card)" stroke="#d49d31" stroke-width="1.5"/>
    <rect x="285" y="330" width="240" height="465" rx="18" fill="url(#card)" stroke="#d49d31" stroke-width="1.5"/>
    <rect x="545" y="330" width="240" height="465" rx="18" fill="url(#card)" stroke="#d49d31" stroke-width="1.5"/>
    <rect x="805" y="330" width="240" height="465" rx="18" fill="url(#card)" stroke="#d49d31" stroke-width="1.5"/>
    <rect x="1065" y="330" width="240" height="465" rx="18" fill="url(#card)" stroke="#d49d31" stroke-width="1.5"/>
    <rect x="1325" y="330" width="250" height="465" rx="18" fill="url(#card)" stroke="#d49d31" stroke-width="1.5"/>
  </g>

  <!-- Connector stems -->
  <g stroke="#f5b942" stroke-width="3">
    <line x1="145" y1="309" x2="145" y2="330"/><line x1="405" y1="309" x2="405" y2="330"/>
    <line x1="665" y1="309" x2="665" y2="330"/><line x1="925" y1="309" x2="925" y2="330"/>
    <line x1="1185" y1="309" x2="1185" y2="330"/><line x1="1445" y1="309" x2="1445" y2="330"/>
  </g>

  <!-- Simple icons -->
  <g stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="92" y="370" width="106" height="68" rx="8"/><line x1="126" y1="454" x2="164" y2="454"/><line x1="145" y1="438" x2="145" y2="454"/><path d="M128 390l-16 14 16 14M162 390l16 14-16 14" stroke="#f5b942"/>
    <rect x="353" y="370" width="104" height="68" rx="8"/><path d="M405 424v-36m0 0l-18 18m18-18l18 18" stroke="#f5b942"/><circle cx="442" cy="429" r="16" stroke="#f5b942"/><path d="M434 429l6 6 10-12" stroke="#f5b942"/>
    <path d="M631 381h25c0-14 9-22 20-22s20 8 20 22v25c14 0 22 9 22 20s-8 20-22 20v25h-25c0-14-9-22-20-22s-20 8-20 22h-25v-25c-14 0-22-9-22-20s8-20 22-20v-25h25z"/>
    <path d="M925 359l48 20v34c0 31-20 55-48 68-28-13-48-37-48-68v-34z"/><path d="M904 420l14 14 29-35" stroke="#f5b942"/>
    <path d="M1122 446a64 64 0 0 1 126 0"/><line x1="1185" y1="414" x2="1219" y2="390" stroke="#f5b942"/><circle cx="1185" cy="414" r="7" fill="#f5b942" stroke="none"/>
    <path d="M1410 444c18-43 48-70 88-82-5 42-24 77-62 99z"/><path d="M1428 456l-18 24 29-9" stroke="#f5b942"/><path d="M1497 363l-8 41 34 20"/><circle cx="1468" cy="406" r="12"/><path d="M1425 469l-15 18M1438 475l-7 21" stroke="#f5b942"/>
  </g>

  <!-- Headings and separators -->
  <g>
    <line x1="50" y1="485" x2="240" y2="485" class="thin"/><text x="145" y="528" text-anchor="middle" class="heading">Baseline</text>
    <line x1="310" y1="485" x2="500" y2="485" class="thin"/><text x="405" y="528" text-anchor="middle" class="heading">Checkpoint 1</text>
    <line x1="570" y1="485" x2="760" y2="485" class="thin"/><text x="665" y="528" text-anchor="middle" class="heading">Checkpoint 2</text>
    <line x1="830" y1="485" x2="1020" y2="485" class="thin"/><text x="925" y="528" text-anchor="middle" class="heading">Checkpoint 3</text>
    <line x1="1090" y1="485" x2="1280" y2="485" class="thin"/><text x="1185" y="520" text-anchor="middle" class="heading"><tspan x="1185">Runtime</tspan><tspan x="1185" dy="30">Modernization</tspan></text>
    <line x1="1350" y1="485" x2="1550" y2="485" class="thin"/><text x="1450" y="520" text-anchor="middle" class="heading"><tspan x="1450">Production</tspan><tspan x="1450" dy="30">Cutover</tspan></text>
  </g>

  <!-- Bullet content -->
  <g class="body">
    <!-- 1 -->
    <circle cx="52" cy="575" r="5" class="bullet"/><text x="68" y="582">Laravel 10</text>
    <circle cx="52" cy="620" r="5" class="bullet"/><text x="68" y="627">PHP 8.1</text>
    <circle cx="52" cy="665" r="5" class="bullet"/><text x="68" y="672"><tspan x="68">Legacy production</tspan><tspan x="68" dy="24">schema</tspan></text>
    <circle cx="52" cy="735" r="5" class="bullet"/><text x="68" y="742"><tspan x="68">Live checkout, payment,</tspan><tspan x="68" dy="24">stock, and catalogue</tspan><tspan x="68" dy="24">workflows</tspan></text>

    <!-- 2 -->
    <circle cx="312" cy="575" r="5" class="bullet"/><text x="328" y="582"><tspan x="328">Upgrade to</tspan><tspan x="328" dy="24">Laravel 11</tspan></text>
    <circle cx="312" cy="645" r="5" class="bullet"/><text x="328" y="652"><tspan x="328">Compatibility</tspan><tspan x="328" dy="24">fixes</tspan></text>
    <circle cx="312" cy="715" r="5" class="bullet"/><text x="328" y="722"><tspan x="328">Regression</tspan><tspan x="328" dy="24">validation</tspan></text>

    <!-- 3 -->
    <circle cx="572" cy="575" r="5" class="bullet"/><text x="588" y="582"><tspan x="588">Upgrade to</tspan><tspan x="588" dy="24">Laravel 12</tspan></text>
    <circle cx="572" cy="645" r="5" class="bullet"/><text x="588" y="652"><tspan x="588">Blade and framework</tspan><tspan x="588" dy="24">compatibility</tspan><tspan x="588" dy="24">adjustments</tspan></text>
    <circle cx="572" cy="742" r="5" class="bullet"/><text x="588" y="749"><tspan x="588">Checkout and callback</tspan><tspan x="588" dy="24">boundaries protected</tspan></text>

    <!-- 4 -->
    <circle cx="832" cy="575" r="5" class="bullet"/><text x="848" y="582"><tspan x="848">Upgrade to</tspan><tspan x="848" dy="24">Laravel 13</tspan></text>
    <circle cx="832" cy="645" r="5" class="bullet"/><text x="848" y="652"><tspan x="848">PreventRequestForgery</tspan><tspan x="848" dy="24">updates</tspan></text>
    <circle cx="832" cy="715" r="5" class="bullet"/><text x="848" y="722"><tspan x="848">Cache security</tspan><tspan x="848" dy="24">allow-list</tspan></text>
    <circle cx="832" cy="765" r="5" class="bullet"/><text x="848" y="772">PHPUnit 12 compatibility</text>

    <!-- 5 -->
    <circle cx="1092" cy="590" r="5" class="bullet"/><text x="1108" y="597">PHP 8.3</text>
    <circle cx="1092" cy="630" r="5" class="bullet"/><text x="1108" y="637"><tspan x="1108">Composer platform</tspan><tspan x="1108" dy="23">8.3</tspan></text>
    <circle cx="1092" cy="690" r="5" class="bullet"/><text x="1108" y="697">Carbon 3.13.1</text>
    <circle cx="1092" cy="735" r="5" class="bullet"/><text x="1108" y="742">Node.js 22.16.0</text>
    <circle cx="1092" cy="775" r="5" class="bullet"/><text x="1108" y="782">npm 10.9.2</text>

    <!-- 6 -->
    <circle cx="1352" cy="590" r="5" class="bullet"/><text x="1368" y="597">Validated staging release</text>
    <circle cx="1352" cy="630" r="5" class="bullet"/><text x="1368" y="637"><tspan x="1368">Controlled production</tspan><tspan x="1368" dy="23">deployment</tspan></text>
    <circle cx="1352" cy="690" r="5" class="bullet"/><text x="1368" y="697">Laravel 13.20.0 live</text>
    <circle cx="1352" cy="730" r="5" class="bullet"/><text x="1368" y="737"><tspan x="1368">Post-cutover issue</tspan><tspan x="1368" dy="23">detected and narrowed</tspan></text>
    <circle cx="1352" cy="785" r="5" class="bullet"/><text x="1368" y="792">Hotfix applied</text>
  </g>

  <!-- Quality gates panel -->
  <rect x="25" y="835" width="1550" height="220" rx="22" fill="#092440" stroke="#d49d31" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M85 885l43 17v31c0 28-18 49-43 61-25-12-43-33-43-61v-31z" fill="none" stroke="#f5b942" stroke-width="6"/>
  <path d="M65 935l15 15 27-34" fill="none" stroke="#f5b942" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="155" y="920" class="heading"><tspan x="155">Verified</tspan><tspan x="155" dy="34">Quality Gates</tspan></text>
  <line x1="315" y1="865" x2="315" y2="1025" class="thin"/>

  <g text-anchor="middle">
    <text x="425" y="912" class="metric"><tspan x="425">55 tests</tspan><tspan x="425" dy="28">372 assertions</tspan></text>
    <text x="425" y="990" class="metric2">Critical suite</text>
    <line x1="530" y1="865" x2="530" y2="1025" class="thin"/>

    <text x="640" y="912" class="metric"><tspan x="640">209 tests</tspan><tspan x="640" dy="28">1,101 assertions</tspan></text>
    <text x="640" y="990" class="metric2">Representative suite</text>
    <line x1="750" y1="865" x2="750" y2="1025" class="thin"/>

    <text x="850" y="912" class="metric"><tspan x="850">149 PHP files</tspan><tspan x="850" dy="28">syntax checked</tspan></text>
    <text x="850" y="990" class="metric2">Static validation</text>
    <line x1="950" y1="865" x2="950" y2="1025" class="thin"/>

    <text x="1045" y="912" class="metric"><tspan x="1045">70 routes</tspan><tspan x="1045" dy="28">validated</tspan></text>
    <text x="1045" y="990" class="metric2">Runtime contract</text>
    <line x1="1145" y1="865" x2="1145" y2="1025" class="thin"/>

    <text x="1250" y="902" class="metric"><tspan x="1250">MySQL 8</tspan><tspan x="1250" dy="28">MariaDB 10.6</tspan><tspan x="1250" dy="28">passed</tspan></text>
    <line x1="1355" y1="865" x2="1355" y2="1025" class="thin"/>

    <text x="1460" y="912" class="metric"><tspan x="1460">Frontend build</tspan><tspan x="1460" dy="28">passed</tspan></text>
    <text x="1460" y="990" class="metric2">Node.js 22</text>
  </g>

  <line x1="535" y1="1082" x2="765" y2="1082" stroke="#f5b942" stroke-width="2"/>
  <polygon points="800,1072 810,1082 800,1092 790,1082" fill="#f5b942"/>
  <line x1="835" y1="1082" x2="1065" y2="1082" stroke="#f5b942" stroke-width="2"/>
  <text x="800" y="1115" text-anchor="middle" class="small" font-style="italic">Public-safe sanitized evidence for portfolio use.</text>
</svg>